<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Sets the character encoding -->
  <meta charset="UTF-8">

  <!-- Helps the webpage display correctly on different screen sizes -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Sets the title shown in the browser tab -->
  <title>W Chews</title>

  <!-- Connects the CSS file -->
  <link rel="stylesheet" href="style.css">

  <!-- Connects the JavaScript file -->
  <script src="script.js" defer></script>
</head>

<body>
  <!-- Header section containing the app title and welcome message -->
  <header>
    <!-- Main application title -->
    <h1>W CHEWS</h1>

    <!-- Welcome message explaining the purpose of the app -->
    <p>
      Welcome to W Chews! Designed to help school staff get lunch faster 
      without waiting in long lines so you can enjoy your lunch break.
    </p>
  </header>
</body><!-- Hidden menu section that appears after a vendor is selected -->
  <section id="menuSection" style="display: none;">
    <!-- Back button to return to vendor choices -->
    <button type="button" id="backButton" onclick="goBack()">← Back to Food Choices</button>

    <!-- Heading that updates to show the chosen vendor's name -->
    <h2 id="menuTitle">Menu</h2>

    <!-- Container where JavaScript will place the menu checkboxes -->
    <div id="menuItems"></div>
  </section>
<!-- Section where staff choose which vendor menu to open -->
  <main id="vendorSection">
    <h2>Available food of the day</h2>

    <!-- Buttons for each lunch option -->
    <div class="vendor-buttons">
      <button type="button" onclick="openMenu('Burger King')">Burger King</button>
      <button type="button" onclick="openMenu('Sun Pizza')">Sun Pizza</button>
      <button type="button" onclick="openMenu('School Lunch')">School Lunch</button>
    </div>
  </main>
</html>
<!-- Input fields for staff details -->
    <div class="order-inputs">
      <label for="staffName">Staff Name:</label>
      <input type="text" id="staffName" placeholder="Enter your name">

      <label for="roomNumber">Room Number:</label>
      <input type="text" id="roomNumber" placeholder="Enter your room number">

      <!-- Button to submit the lunch order -->
      <button type="button" id="placeOrderBtn" onclick="submitOrder()">Place Order</button>
    </div><!-- Box where the order confirmation or reminder message appears -->
    <div id="orderConfirmation" style="display: none;"></div><!-- Displays saved past orders from this browser -->
    <div id="historySection">
      <h3>Past Orders (This Browser)</h3>
      <ul id="orderHistoryList"></ul>
      <button type="button" id="clearHistoryBtn" onclick="clearHistory()">Clear History</button>
    </div>
